<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MuSSE 16x16 表情离线预览</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #101318; color: #e6edf3;
         font-family: "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
  .layout { display: flex; gap: 28px; flex-wrap: wrap; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; }
  canvas { background: #000; border-radius: 6px; display: block; image-rendering: pixelated; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  button { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
           border-radius: 6px; padding: 7px 11px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: #58a6ff; }
  button.active { background: #1f6feb; border-color: #1f6feb; }
  label { font-size: 13px; color: #c9d1d9; display: flex; align-items: center; gap: 7px; }
  select { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
           border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  input[type=range] { width: 150px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .status { font-size: 13px; color: #8b949e; margin-top: 12px; line-height: 1.7; }
  .note { max-width: 460px; font-size: 12px; color: #8b949e; line-height: 1.7; }
  code { color: #79c0ff; }
</style>
</head>
<body>
  <h1>MuSSE 16×16 表情离线预览</h1>
  <div class="sub">帧数据由 C++ <code>EmotionRenderer</code> / <code>StateAdapter</code> 预生成并内嵌；JavaScript 仅负责播放与显示，不包含表情算法。</div>

  <div class="layout">
    <div class="panel">
      <canvas id="matrix" width="384" height="384"></canvas>
      <div class="status" id="status">–</div>
    </div>

    <div class="panel">
      <div class="controls" id="emotionButtons"></div>

      <div class="row">
        <label>输入来源
          <select id="mode">
            <option value="emotion">MuSSE 表情</option>
            <option value="state">上游设备状态（模拟）</option>
            <option value="upstreamEmotion">上游情绪名称（模拟）</option>
          </select>
        </label>
        <label>取值 <select id="value"></select></label>
      </div>

      <div class="controls">
        <button id="play">暂停</button>
        <button id="prev">上一帧</button>
        <button id="next">下一帧</button>
        <button id="sequence">状态序列 Idle→Listening→Thinking→Speaking→Idle</button>
      </div>
      <div class="row">
        <label>进度 <input type="range" id="scrub" min="0" max="59" value="0"></label>
      </div>
      <div class="row">
        <label>速度 <input type="range" id="speed" min="0.25" max="2" step="0.25" value="1"></label>
        <span id="speedLabel" class="status" style="margin-top:0">1.00×</span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="mono"> 单色预览（亮度阈值 32）</label>
      </div>
      <div class="note" style="margin-top:18px">
        这是离线软件模拟，不是实际语音模型输出，也不代表真机 LED 已点亮。<br>
        “上游设备状态 / 上游情绪名称”输入由 C++ <code>StateAdapter</code> 解析，<code>Connecting</code> 回退为 Idle。<br>
        Thinking 只由显式事件触发，不是上游设备状态。
      </div>
    </div>
  </div>

<script id="musse-data" type="application/json">__MUSSE_PREVIEW_JSON__</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("musse-data").textContent);
  const EMOTIONS = ["Idle", "Listening", "Thinking", "Speaking", "Error"];
  const FRAME_MS = DATA.meta.frameMs;
  const W = DATA.meta.width;
  const H = DATA.meta.height;
  const SCALE = 24;

  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const scrub = document.getElementById("scrub");
  const speed = document.getElementById("speed");
  const speedLabel = document.getElementById("speedLabel");
  const mono = document.getElementById("mono");
  const playBtn = document.getElementById("play");
  const emotionButtons = document.getElementById("emotionButtons");
  const modeSelect = document.getElementById("mode");
  const valueSelect = document.getElementById("value");

  let mode = "emotion";
  let sourceLabel = "MuSSE 表情";
  let frames = DATA.emotions.Idle;
  let labels = null;
  let index = 0;
  let playing = true;
  let speedValue = 1;
  let accumulator = 0;

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }

  function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const frame = frames[index];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const rgb = hexToRgb(frame[y * W + x]);
        let fill;
        if (mono.checked) {
          const luma = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000;
          fill = luma >= 32 ? "#ffffff" : "#000000";
        } else {
          fill = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
        }
        ctx.fillStyle = fill;
        ctx.fillRect(x * SCALE + 1, y * SCALE + 1, SCALE - 2, SCALE - 2);
      }
    }
    const label = labels ? labels[index] : valueSelect.value;
    const thinkingNote = label === "Thinking" ? "（显式模拟事件，非上游状态）" : "";
    statusEl.textContent = "来源: " + sourceLabel + "   取值: " + label + thinkingNote +
                           "   帧: " + (index + 1) + " / " + frames.length +
                           "   帧间隔: " + FRAME_MS + " ms   速度: " + speedValue.toFixed(2) + "×";
    scrub.value = String(index);
  }

  function setFrames(nextFrames, nextLabels, label) {
    frames = nextFrames;
    labels = nextLabels;
    index = 0;
    accumulator = 0;
    scrub.max = String(frames.length - 1);
    sourceLabel = label;
    draw();
  }

  function populateValues() {
    const values = mode === "emotion" ? EMOTIONS
                 : mode === "state" ? Object.keys(DATA.upstreamStates)
                 : Object.keys(DATA.upstreamEmotions);
    valueSelect.innerHTML = "";
    for (const name of values) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      valueSelect.appendChild(option);
    }
  }

  function applySelection(keepValue) {
    populateValues();
    const requested = keepValue && Array.from(valueSelect.options).some(o => o.value === keepValue)
      ? keepValue : valueSelect.value;
    valueSelect.value = requested;
    if (mode === "emotion") {
      setFrames(DATA.emotions[requested], null, "MuSSE 表情");
    } else if (mode === "state") {
      setFrames(DATA.upstreamStates[requested], null, "上游设备状态（模拟）");
    } else {
      setFrames(DATA.upstreamEmotions[requested], null, "上游情绪名称（模拟）");
    }
    for (const button of emotionButtons.querySelectorAll("button")) {
      button.classList.toggle("active", mode === "emotion" && button.dataset.emotion === requested);
    }
  }

  for (const name of EMOTIONS) {
    const button = document.createElement("button");
    button.textContent = name;
    button.dataset.emotion = name;
    button.addEventListener("click", () => {
      mode = "emotion";
      modeSelect.value = "emotion";
      applySelection(name);
    });
    emotionButtons.appendChild(button);
  }

  modeSelect.addEventListener("change", () => {
    mode = modeSelect.value;
    applySelection(null);
  });

  valueSelect.addEventListener("change", () => {
    applySelection(valueSelect.value);
  });

  document.getElementById("sequence").addEventListener("click", () => {
    for (const button of emotionButtons.querySelectorAll("button")) {
      button.classList.remove("active");
    }
    setFrames(DATA.sequenceFrames, DATA.sequenceLabels, "状态序列");
  });

  playBtn.addEventListener("click", () => {
    playing = !playing;
    playBtn.textContent = playing ? "暂停" : "播放";
  });

  document.getElementById("prev").addEventListener("click", () => {
    index = (index - 1 + frames.length) % frames.length;
    draw();
  });
  document.getElementById("next").addEventListener("click", () => {
    index = (index + 1) % frames.length;
    draw();
  });

  scrub.addEventListener("input", () => {
    index = Number(scrub.value);
    draw();
  });

  speed.addEventListener("input", () => {
    speedValue = Number(speed.value);
    speedLabel.textContent = speedValue.toFixed(2) + "×";
    draw();
  });

  mono.addEventListener("change", draw);

  let last = null;
  function tick(ts) {
    if (last === null) {
      last = ts;
    }
    const delta = ts - last;
    last = ts;
    if (playing) {
      accumulator += delta * speedValue;
      while (accumulator >= FRAME_MS) {
        accumulator -= FRAME_MS;
        index = (index + 1) % frames.length;
      }
    }
    draw();
    window.requestAnimationFrame(tick);
  }

  modeSelect.value = "emotion";
  applySelection("Idle");
  window.requestAnimationFrame(tick);
})();
</script>
</body>
</html>
